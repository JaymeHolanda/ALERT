name: Daily Price Check

on:
  schedule:
    # 14:00 UTC = 11:00 BRT
    - cron: '0 14 * * 1-5' # Runs Monday through Friday at 11:00 AM Brazil Time
  workflow_dispatch: # Allows manual trigger from GitHub UI for testing

jobs:
  check-prices:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run daily check script
        run: node scripts/daily-check.js
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
